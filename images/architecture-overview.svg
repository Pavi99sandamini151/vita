<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" role="img" font-family="Inter, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Document chatbot architecture overview</title>
<desc>A React UI calls a Flask API, which uses a local embedding model, an in-memory vector store, and a local language model run by Ollama.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="380" fill="#FFFFFF"/>
<rect x="20" y="108" width="640" height="240" rx="12" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 4"/>
<text x="36" y="128" font-size="12" fill="#5F5E5A" dominant-baseline="central">Backend, runs locally</text>
<g>
<rect x="240" y="30" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="48" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">React UI</text>
<text x="340" y="66" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">Upload and chat</text>
</g>
<g>
<rect x="220" y="130" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="148" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">Flask API</text>
<text x="340" y="166" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">/upload and /ask</text>
</g>
<g>
<rect x="40" y="260" width="176" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="128" y="278" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">Embedding model</text>
<text x="128" y="296" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">sentence-transformers</text>
</g>
<g>
<rect x="252" y="260" width="176" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="278" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">Vector store</text>
<text x="340" y="296" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">In-memory NumPy array</text>
</g>
<g>
<rect x="464" y="260" width="176" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="552" y="278" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">Language model</text>
<text x="552" y="296" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">Ollama, runs locally</text>
</g>
<g stroke="#5F5E5A" stroke-width="1.5" fill="none">
<line x1="340" y1="86" x2="340" y2="126" marker-end="url(#arrow)"/>
<line x1="285" y1="186" x2="138" y2="256" marker-end="url(#arrow)"/>
<line x1="340" y1="186" x2="340" y2="256" marker-end="url(#arrow)"/>
<line x1="395" y1="186" x2="542" y2="256" marker-end="url(#arrow)"/>
