<svg xmlns="http://www.w3.org/2000/svg" width="680" height="270" viewBox="0 0 680 270" role="img" font-family="Inter, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Upload and question data flows</title>
<desc>The upload path extracts text, splits it into chunks, embeds them and stores the vectors. The question path embeds the question, finds matching chunks, builds a prompt and asks the local model.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="270" fill="#FFFFFF"/>
<text x="50" y="40" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">Upload path, once per document</text>
<g fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5">
<rect x="50" y="60" width="130" height="56" rx="8"/>
<rect x="200" y="60" width="130" height="56" rx="8"/>
<rect x="350" y="60" width="130" height="56" rx="8"/>
<rect x="500" y="60" width="130" height="56" rx="8"/>
</g>
<g font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">
<text x="115" y="78">Extract text</text>
<text x="265" y="78">Chunk</text>
<text x="415" y="78">Embed</text>
<text x="565" y="78">Vector store</text>
</g>
<g font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">
<text x="115" y="96">.txt or .pdf</text>
<text x="265" y="96">With overlap</text>
<text x="415" y="96">Text to numbers</text>
<text x="565" y="96">Kept in memory</text>
</g>
<g stroke="#5F5E5A" stroke-width="1.5" fill="none">
<line x1="180" y1="88" x2="198" y2="88" marker-end="url(#arrow)"/>
<line x1="330" y1="88" x2="348" y2="88" marker-end="url(#arrow)"/>
<line x1="480" y1="88" x2="498" y2="88" marker-end="url(#arrow)"/>
</g>
<text x="50" y="150" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">Question path, every question</text>
<g fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5">
<rect x="50" y="170" width="130" height="56" rx="8"/>
<rect x="200" y="170" width="130" height="56" rx="8"/>
<rect x="350" y="170" width="130" height="56" rx="8"/>
<rect x="500" y="170" width="130" height="56" rx="8"/>
</g>
<g font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">
<text x="115" y="188">Embed query</text>
<text x="265" y="188">Find matches</text>
<text x="415" y="188">Build prompt</text>
<text x="565" y="188">Ask Ollama</text>
</g>
<g font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">
<text x="115" y="206">Same model</text>
<text x="265" y="206">Top few chunks</text>
<text x="415" y="206">Chunks + query</text>
<text x="565" y="206">Local model</text>
</g>
<g stroke="#5F5E5A" stroke-width="1.5" fill="none">
<line x1="180" y1="198" x2="198" y2="198" marker-end="url(#arrow)"/>
<line x1="330" y1="198" x2="348" y2="198" marker-end="url(#arrow)"/>
<line x1="480" y1="198" x2="498" y2="198" marker-end="url(#arrow)"/>
</g>
</svg>
